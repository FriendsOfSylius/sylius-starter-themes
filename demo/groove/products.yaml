# Groove demo catalog: sixteen fictional records for the import package (castor sylius:import:fixtures:*).
# The covers are shipped in media/ under the code of each product; the image URLs below are placeholders that the
# import never downloads, since a cover with that code is already there. See docs/themes/groove.md.
mode: ai
name: Groove Records
products:
    -   title: 'The Marlowe Quartet — Blue Hours'
        collection_name: Jazz
        price_eur: 59.9
        image: 'https://example.com/groove/the-marlowe-quartet-blue-hours.webp'
        description: 'A 1961 session cut again from the original analogue tapes, at 45 rpm on two records. Archive series, LTA-1961-45. Half-speed mastered, pressed at Optimal Media on 180 g translucent blue vinyl, tip-on gatefold. 3,000 numbered copies.'
    -   title: 'Ada Okoro Trio — Lagos After Dark'
        collection_name: Jazz
        price_eur: 32
        image: 'https://example.com/groove/ada-okoro-trio-lagos-after-dark.webp'
        description: 'Piano trio recorded live in one night, between Lagos highlife and modal jazz. Lowtide Records, LOW-112. 180 g black vinyl, printed inner sleeve with liner notes.'
    -   title: 'Hollis Grant — Spiral Staircase'
        collection_name: Jazz
        price_eur: 145
        image: 'https://example.com/groove/hollis-grant-spiral-staircase.webp'
        description: 'Original 1967 first pressing, mono. Matrix A1 / B1, deep groove labels. Graded VG+ / VG+: light sleeve wear, plays with a quiet surface. Ultrasonic cleaned and resleeved.'
