        title: 'Un métier de torréfacteur, <em>lot après lot.</em>'
        lead: 'Nous goûtons à l’origine, torréfions chaque café selon son propre profil et le laissons reposer avant de l’expédier, pour qu’il vous arrive à son meilleur.'
