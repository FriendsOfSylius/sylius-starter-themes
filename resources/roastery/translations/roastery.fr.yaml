            kicker: 'Profil de torréfaction'
            title: 'Éthiopie Guji'
            lot: 'Lot nº 27 · procédé nature'
            curve: 'Courbe de torréfaction : la température du grain baisse quand le café vert entre dans le tambour, puis remonte régulièrement jusqu’au premier crack, vers la dixième minute, et se stabilise jusqu’à la fin de la torréfaction à douze minutes.'
            first_crack: 'Premier crack'
            origin:
                label: 'Ferme'
                value: 'Hambela, station de lavage villageoise'
            altitude:
                label: 'Altitude'
                value: '2 100 à 2 300 m'
            process:
                label: 'Extraction'
                value: 'Filtre, V60, Aeropress'
            notes:
                label: 'En tasse'
                value: 'Myrtille, jasmin, grué de cacao'
